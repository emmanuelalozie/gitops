version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      desktop-npm:
        patterns: ['*']
    # Major versions of the app's build tools and libraries (TypeScript, Vite, Tauri...) change how they're
    # configured, so they're upgraded on purpose, by hand, not proposed weekly. Minor and patch updates still come.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: weekly
    groups:
      desktop-cargo:
        patterns: ['*']
    # Major versions of the app's build tools and libraries (TypeScript, Vite, Tauri...) change how they're
    # configured, so they're upgraded on purpose, by hand, not proposed weekly. Minor and patch updates still come.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
