name: Drift detection

# Checks every day that the live systems still match Git. Opens (or updates) an issue labelled
# "drift" when they don't, and closes it again once they match.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: Drift in ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [prod, github, github-repo, github-branches]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITOPS_ADMIN_TOKEN: ${{ secrets.GITOPS_ADMIN_TOKEN }}
      TITLE: Drift detected in ${{ matrix.target }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Plan
        id: plan
        run: |
          ./gradlew -q plan -Ptarget=${{ matrix.target }} -Pargs="--format markdown --out plan.md --skip-without-token"
          cat plan.md >> "$GITHUB_STEP_SUMMARY"
          if grep -qE "No changes|Skipped" plan.md; then echo "drift=false"; else echo "drift=true"; fi >> "$GITHUB_OUTPUT"
      - name: Find the open drift issue
        id: issue
        run: |
          number=$(gh issue list --state open --label drift --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty" 2>/dev/null || true)
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Report drift
        if: steps.plan.outputs.drift == 'true'
        run: |
          { cat plan.md; echo; echo "Found by $RUN_URL. Fix it by changing Git (and merging), or by re-running the Apply workflow."; } > body.md
          if [ -n "${{ steps.issue.outputs.number }}" ]; then
            gh issue comment "${{ steps.issue.outputs.number }}" --body-file body.md
          else
            # The drift label is managed in config/github/labels; only create it, from that file, if it's missing.
            label=config/github/labels/drift.json
            gh label create drift --color "$(jq -r .color "$label")" --description "$(jq -r .description "$label")" 2>/dev/null || true
            gh issue create --title "$TITLE" --label drift --body-file body.md
          fi
          echo "::error::Live state of ${{ matrix.target }} has drifted from Git"
          exit 1
      - name: Close the drift issue
        if: steps.plan.outputs.drift == 'false' && steps.issue.outputs.number != ''
        run: gh issue close "${{ steps.issue.outputs.number }}" --comment "No drift as of $RUN_URL."
