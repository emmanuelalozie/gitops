name: Release

# Publishes a GitHub release with a runnable jar. Either push a tag (git tag v1.2.3 && git push origin v1.2.3)
# or run this workflow by hand with a version, which tags the current commit of the chosen branch.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 0.2.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Work out the version
        id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="${INPUT#v}"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$v' is not a version like 1.2.3"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build, test and package
        run: ./gradlew build validateConfig cliJar -PreleaseVersion=${{ steps.version.outputs.version }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jar="build/libs/gitops-$VERSION-all.jar"
          (cd build/libs && sha256sum "gitops-$VERSION-all.jar" > "gitops-$VERSION-all.jar.sha256")
          {
            echo "Run it with Java 21 from a checkout of this repository:"
            echo
            echo '```'
            echo "java -jar gitops-$VERSION-all.jar plan --target prod"
            echo '```'
          } > notes.md
          gh release create "v$VERSION" "$jar" "$jar.sha256" --title "v$VERSION" --target "$GITHUB_SHA" \
            --notes-file notes.md --generate-notes
