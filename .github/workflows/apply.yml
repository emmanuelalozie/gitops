name: Apply

# Git is the source of truth: once a config change is merged, make the live systems match it.
on:
  push:
    branches: [develop]
    paths:
      - 'config/prod/**'
      - 'config/github/**'
      - 'config/github-repo/**'
      - 'config/github-branches/**'
  workflow_dispatch:

concurrency:
  group: apply
  cancel-in-progress: false

jobs:
  apply:
    name: Apply ${{ matrix.target }}
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in Settings > Environments to gate applies.
    environment: production
    permissions:
      contents: read
      issues: write # labels are managed through the issues API
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [prod, github, github-repo, github-branches]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repository settings and branch protection need an admin token; without it those targets are skipped.
          GITOPS_ADMIN_TOKEN: ${{ secrets.GITOPS_ADMIN_TOKEN }}
          # Only needed once prod points at the API in server/, which protects writes with it.
          GITOPS_PROD_USERS_TOKEN: ${{ secrets.GITOPS_PROD_USERS_TOKEN }}
        run: ./gradlew applyConfig -Ptarget=${{ matrix.target }} -Pargs=--skip-without-token
