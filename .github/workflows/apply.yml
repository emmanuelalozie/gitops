name: Apply

# Git is the source of truth: once a config change is merged, make the live systems match it.
on:
  push:
    branches: [develop]
    paths:
      - 'config/**'
      # dev is the CI mock (workflows: false in its target.json); changing it alone needs no apply.
      - '!config/dev/**'
  workflow_dispatch:

concurrency:
  group: apply
  cancel-in-progress: false

jobs:
  targets:
    # Every target with "workflows" on (the default) in its target.json.
    name: List targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - id: list
        run: |
          ./gradlew -q targets -Pargs="--format json --out targets.json" > /dev/null
          echo "list=$(jq -c '[.targets[] | select(.workflows) | .name]' targets.json)" >> "$GITHUB_OUTPUT"

  apply:
    name: Apply ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in Settings > Environments to gate applies.
    environment: production
    permissions:
      contents: read
      issues: write # labels are managed through the issues API
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repository settings and branch protection need an admin token; without it those targets are skipped.
          GITOPS_ADMIN_TOKEN: ${{ secrets.GITOPS_ADMIN_TOKEN }}
        run: ./gradlew applyConfig -Ptarget=${{ matrix.target }} -Pargs=--skip-without-token
