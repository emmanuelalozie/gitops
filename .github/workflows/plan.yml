name: Plan

# Comments on the pull request with what the Apply workflow would change once it merges.
on:
  pull_request:
    paths:
      - 'config/**'
      - 'src/**'
      - 'build.gradle'

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Plan every live target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: admin token for repository settings and branch protection (skipped without it).
          GITOPS_ADMIN_TOKEN: ${{ secrets.GITOPS_ADMIN_TOKEN }}
        run: |
          {
            echo "## GitOps plan"
            echo
            echo "What the Apply workflow will change when this pull request is merged."
          } > plan.md
          for target in prod github github-repo github-branches; do
            ./gradlew -q plan -Ptarget=$target -Pargs="--format markdown --out plan-$target.md --skip-without-token"
            { echo; cat plan-$target.md; } >> plan.md
          done
          cat plan.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the pull request
        # Pull requests from forks get a read-only token, so they only get the job summary.
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: gitops-plan
          path: plan.md
