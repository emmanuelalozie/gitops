plugins {
    id 'java'
}

group = 'gitops'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.rest-assured:rest-assured:6.1.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.3'
    implementation 'com.networknt:json-schema-validator:3.0.8'
    implementation 'org.slf4j:slf4j-nop:2.0.20'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
    testImplementation 'org.assertj:assertj-core:3.27.7'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events = ['failed']
        exceptionFormat = 'full'
    }
}

// ---------------------------------------------------------------------------
// GitOps tasks. Pick the target with -Ptarget=<name> (a directory under config/).
//   ./gradlew validateConfig                 validate every target against its schema
//   ./gradlew plan -Ptarget=prod             show what apply would change
//   ./gradlew detectDrift -Ptarget=prod      like plan, but fails if there is drift
//   ./gradlew applyConfig -Ptarget=dev       make the live system match Git
//   ./gradlew snapshot -Ptarget=prod         import live state into Git (bootstrap)
//   ./gradlew fetch -Ptarget=prod            print live state
// Extra CLI flags can be passed with -Pargs="--format markdown --out plan.md".
// ---------------------------------------------------------------------------

def gitopsTask(String name, String description, List<String> cliArgs) {
    tasks.register(name, JavaExec) {
        group = 'gitops'
        it.description = description
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'gitops.Main'
        workingDir = rootDir
        def extra = project.findProperty('args')?.toString()?.trim()
        args = cliArgs + (extra ? extra.split(/\s+/).toList() : [])
    }
}

// No default target: a forgotten -Ptarget must fail, not quietly change prod.
def target = project.findProperty('target')
def targetArgs = target ? ['--target', target.toString()] : []

gitopsTask('validateConfig', 'Validates every target under config/ against its JSON Schema.', ['validate'])
gitopsTask('plan', 'Shows the changes apply would make to the target.', ['plan'] + targetArgs)
gitopsTask('detectDrift', 'Fails if the live system has drifted from Git.', ['plan', '--fail-on-drift'] + targetArgs)
gitopsTask('applyConfig', 'Reconciles the live system to match Git.', ['apply'] + targetArgs)
gitopsTask('snapshot', 'Writes the live state of the target into Git.', ['snapshot'] + targetArgs)
gitopsTask('fetch', 'Prints the live state of the target.', ['fetch'] + targetArgs)
