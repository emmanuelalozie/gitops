plugins {
    id 'java'
}

group = 'gitops'
version = '0.2.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4'
    implementation 'com.networknt:json-schema-validator:3.0.8'
    // YAML for reading .github/workflows (Lint). Jackson 3, like the schema validator, which already brings it.
    implementation 'tools.jackson.dataformat:jackson-dataformat-yaml:3.2.4'
    implementation 'org.slf4j:slf4j-nop:2.0.20'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
    testImplementation 'org.assertj:assertj-core:3.27.7'
}

tasks.named('jar') {
    manifest {
        // Engine.VERSION reads this, and the desktop app checks it at startup.
        attributes('Implementation-Title': 'gitops', 'Implementation-Version': project.version, 'Main-Class': 'gitops.Main')
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // ./gradlew test -Dgitops.updateFixtures=true rewrites the JSON fixtures the desktop app tests share.
    systemProperty 'gitops.updateFixtures', System.getProperty('gitops.updateFixtures', 'false')
    inputs.dir('desktop/src/fixtures').optional()
    testLogging {
        events = ['failed']
        exceptionFormat = 'full'
    }
}

// ---------------------------------------------------------------------------
// GitOps tasks. Pick the target with -Ptarget=<name> (a directory under config/).
//   ./gradlew demo                           try the whole loop on a local mock (needs Node.js or Docker)
//   ./gradlew validateConfig                 validate every target against its schema
//   ./gradlew plan -Ptarget=prod             show what apply would change
//   ./gradlew detectDrift -Ptarget=prod      like plan, but fails if there is drift
//   ./gradlew applyConfig -Ptarget=dev       make the live system match Git
//   ./gradlew snapshot -Ptarget=prod         import live state into Git (bootstrap)
//   ./gradlew fetch -Ptarget=prod            print live state
//   ./gradlew targets                        list targets (-Pargs="--format json" for programs and workflows)
//   ./gradlew lint                           cross-file checks, e.g. required status checks vs workflow jobs
//   ./gradlew engineBundle                   the engine with its own Java runtime, for the desktop app
// Extra CLI flags can be passed with -Pargs="--format markdown --out plan.md".
// ---------------------------------------------------------------------------

def gitopsTask(String name, String description, List<String> cliArgs) {
    tasks.register(name, JavaExec) {
        group = 'gitops'
        it.description = description
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'gitops.Main'
        workingDir = rootDir
        def extra = project.findProperty('args')?.toString()?.trim()
        args = cliArgs + (extra ? extra.split(/\s+/).toList() : [])
    }
}

// Java modules the engine needs (checked with: jdeps --print-module-deps on build/engine/lib).
// java.net.http for the providers; java.sql and java.desktop (java.beans) because Jackson links to them; jdk.crypto.ec for TLS.
ext.engineModules = ['java.base', 'java.desktop', 'java.logging', 'java.net.http', 'java.sql', 'java.xml', 'jdk.crypto.ec', 'jdk.zipfs']

// No default target: a forgotten -Ptarget must fail, not quietly change prod.
def target = project.findProperty('target')
def targetArgs = target ? ['--target', target.toString()] : []

tasks.register('demo', JavaExec) {
    group = 'gitops'
    description = 'Starts the mock users API, runs plan, apply and a drift check against it, then stops it.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'gitops.Demo'
    workingDir = rootDir
}

gitopsTask('validateConfig', 'Validates every target under config/ against its JSON Schema.', ['validate'])
gitopsTask('plan', 'Shows the changes apply would make to the target.', ['plan'] + targetArgs)
gitopsTask('detectDrift', 'Fails if the live system has drifted from Git.', ['plan', '--fail-on-drift'] + targetArgs)
gitopsTask('applyConfig', 'Reconciles the live system to match Git.', ['apply'] + targetArgs)
gitopsTask('snapshot', 'Writes the live state of the target into Git.', ['snapshot'] + targetArgs)
gitopsTask('fetch', 'Prints the live state of the target.', ['fetch'] + targetArgs)
gitopsTask('targets', 'Lists the targets and their settings.', ['targets'])
gitopsTask('lint', 'Checks across files, such as required status checks that no workflow job reports.', ['lint'])
gitopsTask('codeowners', 'Writes the owners in target.json files into .github/CODEOWNERS.', ['codeowners'])
gitopsTask('search', 'Finds resources in Git across every target: -Pargs="--query TEXT".', ['search'])

// ---------------------------------------------------------------------------
// The engine for the desktop app (desktop/): the jars plus a Java runtime trimmed with jlink, so people
// running the app don't need Java installed. Output: build/engine/{lib,runtime,engine.json}.
// The app starts it as: runtime/bin/java -cp "lib/*" gitops.Main serve --config-dir <repo>/config
// ---------------------------------------------------------------------------
def engineDir = layout.buildDirectory.dir('engine')

tasks.register('engineLibs', Sync) {
    group = 'gitops'
    description = 'Copies the engine jar and its dependencies to build/engine/lib.'
    from(tasks.named('jar'))
    from(configurations.runtimeClasspath)
    into(engineDir.map { it.dir('lib') })
}

tasks.register('engineRuntime', Exec) {
    group = 'gitops'
    description = 'Builds a trimmed Java runtime for the engine with jlink into build/engine/runtime.'
    def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    def runtime = engineDir.map { it.dir('runtime') }
    inputs.property('modules', engineModules)
    outputs.dir(runtime)
    doFirst {
        delete(runtime)
        def javaHome = launcher.get().metadata.installationPath.asFile
        def jlink = System.getProperty('os.name').toLowerCase().contains('win') ? 'bin/jlink.exe' : 'bin/jlink'
        commandLine new File(javaHome, jlink).absolutePath,
                '--add-modules', engineModules.join(','),
                '--strip-debug', '--no-header-files', '--no-man-pages', '--compress', 'zip-9',
                '--output', runtime.get().asFile.absolutePath
    }
}

tasks.register('engineBundle') {
    group = 'gitops'
    description = 'Builds the self-contained engine the desktop app runs: build/engine.'
    dependsOn('engineLibs', 'engineRuntime')
    def manifest = engineDir.map { it.file('engine.json') }
    def engineVersion = project.version.toString()
    outputs.file(manifest)
    doLast {
        manifest.get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(
                [engineVersion: engineVersion, schemaVersion: 1, mainClass: 'gitops.Main']))
    }
}
