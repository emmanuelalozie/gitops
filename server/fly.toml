# Example deployment on Fly.io (fly launch --copy-config --no-deploy, from server/).
# Set the token with: fly secrets set API_TOKEN=<a long random string>
app = "gitops-users-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_FILE = "/data/db.json"

[[mounts]]
  source = "gitops_users"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
